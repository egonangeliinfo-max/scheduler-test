name: Isolated scheduler test

on:
  schedule:
    # Test diagnostico vicino nel tempo: 10:57 UTC = 12:57 Europe/Rome oggi.
    - cron: "57 10 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Scheduler OK
        run: |
          echo "isolated scheduler OK"
          date -u
